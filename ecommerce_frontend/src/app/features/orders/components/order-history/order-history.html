<mat-toolbar class="orders-toolbar">
  <h1>Mis Pedidos</h1>
</mat-toolbar>

<section class="orders-state" *ngIf="loading()">
  <mat-spinner diameter="40"></mat-spinner>
</section>

<section class="orders-state" *ngIf="!loading() && errorMessage()">
  {{ errorMessage() }}
</section>

<section class="orders-state" *ngIf="!loading() && !errorMessage() && !orders().length">
  Aún no tienes pedidos registrados.
</section>

<mat-card class="orders-card" *ngIf="!loading() && orders().length">
  <table mat-table [dataSource]="orders()" class="orders-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Pedido</th>
      <td mat-cell *matCellDef="let order">#{{ order.id }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let order">{{ order.status }}</td>
    </ng-container>

    <ng-container matColumnDef="items">
      <th mat-header-cell *matHeaderCellDef>Items</th>
      <td mat-cell *matCellDef="let order">
        <ul class="order-items-list">
          <li *ngFor="let item of order.items">
            {{ item.product_name }} (x{{ item.quantity }})
          </li>
        </ul>
      </td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let order">S/ {{ order.total | number: '1.2-2' }}</td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let order">{{ order.created_at | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
